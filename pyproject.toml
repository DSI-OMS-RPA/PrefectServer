readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "motor>=3.7.0",
    "pandas>=2.2.3",
    "pendulum>=3.1.0",
    "prefect-github>=0.3.1",
    "prefect[github]>=3.3.4",
    "pymongo>=4.12.1",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.1.0",
    "sshtunnel>=0.4.0",
]
